[project]
name = "loom-backend"
version = "0.0.1"
description = "loom demo backend (FastAPI + WebSocket + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.110.0",
  "pydantic-settings>=2.2.1",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100

